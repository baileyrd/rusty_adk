[workspace]
resolver = "2"
members = [
    "crates/adk-core",
    "crates/adk-macros",
    "crates/adk-tools",
    "crates/adk-models",
    "crates/adk-sessions",
    "crates/adk-graph",
    "crates/adk-agents",
    "crates/adk-runner",
    "crates/adk-mcp",
    "crates/adk-a2a",
    "crates/rusty-adk",
    "examples/weather-agent",
    "examples/mcp-tool-server",
    "examples/a2a-agent-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_adk"
homepage = "https://github.com/baileyrd/rusty_adk"
description = "A Rust implementation of the Agent Development Kit (ADK) 2.0 architecture"
keywords = ["adk", "agent", "llm", "ai", "workflow"]
categories = ["asynchronous", "api-bindings"]

[workspace.dependencies]
adk-core = { version = "0.1.0", path = "crates/adk-core" }
adk-macros = { version = "0.1.0", path = "crates/adk-macros" }
adk-tools = { version = "0.1.0", path = "crates/adk-tools" }
adk-models = { version = "0.1.0", path = "crates/adk-models", default-features = false }
adk-sessions = { version = "0.1.0", path = "crates/adk-sessions" }
adk-graph = { version = "0.1.0", path = "crates/adk-graph" }
adk-agents = { version = "0.1.0", path = "crates/adk-agents" }
adk-runner = { version = "0.1.0", path = "crates/adk-runner" }
adk-mcp = { version = "0.1.0", path = "crates/adk-mcp" }
adk-a2a = { version = "0.1.0", path = "crates/adk-a2a" }

async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` makes float parsing exact. Without it serde_json's fast path
# can land a ULP away, so an `Event`'s f64 timestamp does not survive a JSON
# round trip — which the SQLite store relies on, since it holds events as JSON.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util", "process"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
schemars = "0.8"
tokio-test = "0.4"

[profile.release]
lto = "thin"
