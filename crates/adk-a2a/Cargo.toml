[package]
name = "adk-a2a"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Serve a Rust ADK agent over the Agent2Agent (A2A) protocol"

[dependencies]
adk-agents.workspace = true
adk-core.workspace = true
adk-graph.workspace = true
adk-runner.workspace = true
async-stream.workspace = true
async-trait.workspace = true
base64 = "0.22"
futures.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros"] }
tracing.workspace = true
# Not on crates.io yet, so this is a git dependency. `server` is the only
# feature the bridge needs: it implements A2A's `AgentExecutor` trait and
# leaves transport to that crate's `AgentServer`.
rusty_a2a = { git = "https://github.com/baileyrd/rusty_a2a", default-features = false, features = [
  "server",
  "client",
] }

[dev-dependencies]
adk-models.workspace = true
adk-sessions.workspace = true
adk-tools.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-test.workspace = true
axum = "0.7"
rusty_a2a = { git = "https://github.com/baileyrd/rusty_a2a", default-features = false, features = [
  "server",
  "client",
] }
