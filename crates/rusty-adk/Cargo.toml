[package]
name = "rusty-adk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A Rust implementation of the Agent Development Kit (ADK) 2.0 architecture"
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
default = ["macros", "mcp", "models"]
# The #[adk_tool] attribute macro.
macros = ["dep:adk-macros"]
# MCP transports, for interoperating with ADK agents in other languages.
mcp = ["dep:adk-mcp"]
# Live model connectors (Gemini, Anthropic).
models = ["adk-models/gemini", "adk-models/anthropic"]
# A durable, SQLite-backed SessionService.
sqlite = ["adk-sessions/sqlite"]

[dependencies]
adk-core.workspace = true
adk-agents.workspace = true
adk-graph.workspace = true
adk-models.workspace = true
adk-runner.workspace = true
adk-sessions.workspace = true
adk-tools.workspace = true
adk-macros = { workspace = true, optional = true }
adk-mcp = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tokio-test.workspace = true
serde_json.workspace = true
futures.workspace = true
