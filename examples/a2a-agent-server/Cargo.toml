[package]
name = "a2a-agent-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Serves a Rust ADK agent over A2A, so agents in any language can talk to it"

[dependencies]
rusty-adk = { path = "../../crates/rusty-adk", features = ["a2a"] }
adk-a2a.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
axum = "0.7"
