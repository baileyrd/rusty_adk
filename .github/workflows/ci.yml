name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pin the MSRV alongside stable so a newer-toolchain-only feature
        # cannot slip in unnoticed.
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Test (SQLite stores)
        run: cargo test --workspace --features rusty-adk/sqlite,adk-sessions/sqlite

      - name: Doc tests
        run: cargo test --workspace --doc

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  features:
    name: Feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The optional features gate real code paths, so a build with them off
      # has to be checked separately or it will only break for users.
      - name: No default features
        run: cargo check -p rusty-adk --no-default-features

      - name: Macros only
        run: cargo check -p rusty-adk --no-default-features --features macros

      - name: MCP only
        run: cargo check -p rusty-adk --no-default-features --features mcp

      - name: Models only
        run: cargo check -p rusty-adk --no-default-features --features models

      - name: SQLite stores only
        run: cargo check -p rusty-adk --no-default-features --features sqlite

      - name: MCP transports individually
        run: |
          cargo check -p adk-mcp --no-default-features --features stdio
          cargo check -p adk-mcp --no-default-features --features http
          cargo check -p adk-mcp --no-default-features --features client

      - name: Model connectors individually
        run: |
          cargo check -p adk-models --no-default-features
          cargo check -p adk-models --no-default-features --features gemini
          cargo check -p adk-models --no-default-features --features anthropic

  examples:
    name: Examples run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The example is offline by default, so CI can actually run it rather
      # than only compiling it.
      - name: Run the weather-agent example
        run: cargo run -p weather-agent

      - name: Exercise the MCP server over stdio
        run: |
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_weather","arguments":{"city":"Tokyo"}}}' \
            | cargo run -q -p mcp-tool-server > mcp-output.jsonl
          cat mcp-output.jsonl
          python3 - <<'PY'
          import json
          lines = [json.loads(l) for l in open("mcp-output.jsonl") if l.strip()]
          assert len(lines) == 3, f"expected 3 responses, got {len(lines)}"
          assert lines[0]["result"]["serverInfo"]["name"] == "rusty-adk-weather"
          assert len(lines[1]["result"]["tools"]) == 2
          assert lines[2]["result"]["isError"] is False
          assert "Tokyo" in lines[2]["result"]["content"][0]["text"]
          print("MCP stdio transport OK")
          PY
